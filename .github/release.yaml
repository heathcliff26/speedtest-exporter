---
changelog:
  exclude:
    labels:
      - "sync"
  categories:
    - title: "⚠️ Breaking Changes"
      labels:
        - "breaking-change"
        - "type/major"
    - title: "🚀 Features"
      labels:
        - "enhancement"
        - "feature"
    - title: "🐛 Bug Fixes"
      labels:
        - "bug"
    - title: "Documentation"
      labels:
        - "documentation"
    - title: Other Changes
      labels:
        - "*"
